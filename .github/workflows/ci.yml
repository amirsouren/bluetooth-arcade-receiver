name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Tests (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      # No display on CI runners; Qt runs headless.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (venv + distro PyGObject + Qt runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv python3-gi python3-gi-cairo gir1.2-glib-2.0 \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Create venv and install Python dependencies
        run: |
          python3 -m venv --system-site-packages venv
          # PyGObject comes from the distro python3-gi (requirements.txt would
          # otherwise compile it from PyPI and needs libgirepository headers);
          # this mirrors the fallback documented in the README.
          venv/bin/pip install --upgrade pip
          venv/bin/pip install "PySide6>=6.5" "pydbus>=0.6.0" pytest

      - name: Run test suite
        run: venv/bin/python -m pytest tests/ -q
